stage: 2
seed: 42

data:
  train_path: data/processed/train.parquet
  val_path: data/processed/hotpotqa_test.parquet
  prompt_template: patternbloom/agent/prompts.py:STAGE2_PROMPT

policy:
  model_name_or_path: checkpoints/stage1/best/hf
  warm_start_from: checkpoints/stage1/best
  tensor_model_parallel_size: 2
  rollout_n: 8
  max_prompt_len: 1024
  max_response_len: 4096
  max_turns: 6

retrieval:
  endpoint: http://localhost:8000
  top_k: 5

gpm:
  memory_path: data/gpm/memory.json
  encoder_name: BAAI/bge-large-en-v1.5
  top_k: 3
  signature_similarity_threshold: 0.5

par:
  lambda_p: 0.2
  format_gate: true
  answer_metric: f1

train:
  total_epochs: 1
  global_batch_size: 128
  ppo_mini_batch_size: 32
  ppo_micro_batch_size_per_gpu: 1
  learning_rate: 5.0e-7
  kl_coef: 0.005
  clip_ratio: 0.2
  gpu_memory_utilization: 0.4
  checkpoint_interval: 10
  best_metric: val_em
  checkpoint_dir: checkpoints/stage2
